name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Command
        shell: bash
        run: echo "python tools/check_all.py ."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run every checker
        run: python tools/check_all.py .

  tests:
    name: Tests small and medium (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Command
        shell: bash
        run: echo "python -m pytest -m '(small or medium) and not quarantined'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run the small and medium tests
        run: python -m pytest -q -m "(small or medium) and not quarantined"

  gate:
    name: Gate
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Command
        run: echo "test every pre-merge job result is success"
      - name: Require every pre-merge job
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.tests.result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
