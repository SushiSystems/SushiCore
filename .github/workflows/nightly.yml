name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Command
        shell: bash
        run: echo "python tools/check_all.py ."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run every checker
        run: python tools/check_all.py .

  tests:
    name: Tests small and medium (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Command
        shell: bash
        run: echo "python -m pytest -m 'not quarantined and not large'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run every test that gates
        run: python -m pytest -q -m "not quarantined and not large"

  quarantined:
    name: Quarantined tests (reported, never gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Command
        run: echo "python -m pytest -m quarantined"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run the quarantined tests and report them
        run: |
          python -m pytest -q -m quarantined > quarantined.txt 2>&1 && status=0 || status=$?
          cat quarantined.txt
          # pytest exits 5 when no test is quarantined, which is the healthy state.
          echo "quarantined run exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          cat quarantined.txt >> "$GITHUB_STEP_SUMMARY"
