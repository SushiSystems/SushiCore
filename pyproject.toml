[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushicore"
version = "0.9.2"
description = "Shared core for the Sushi* developer CLIs (hub / sr / se / sa / sb / sd / st): workspace resolution, layered config, presentation, the cmake/ctest driver, and dependency provisioning and doctor checks."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
]
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/SushiSystems/SushiCore"
Source = "https://github.com/SushiSystems/SushiCore"

[project.optional-dependencies]
typer = ["typer>=0.12"]
test = ["pytest>=8.0", "pytest-timeout>=2.3", "typer>=0.12", "click>=8.0"]

[tool.setuptools.packages.find]
where = ["source"]
include = ["sushicore*"]

[tool.setuptools.package-data]
sushicore = ["py.typed", "provision/manifests/*.deps.toml"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["source"]
testpaths = ["tests"]
markers = [
    "small: one process and one thread, no network, no sleep, no file outside the build tree (60 s)",
    "medium: threads and processes, localhost, files in a temporary folder (300 s)",
    "large: real hardware, or a run longer than medium allows (900 s)",
    "quarantined: an intermittent test, out of every gating stage; see docs/reference/KNOWN_ISSUES.md",
]
