[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushicore"
version = "0.1.0"
description = "Shared core for the Sushi* developer CLIs (ss / sr / se / sa / sb): workspace resolution, layered config, and presentation."
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sushicore*"]

[tool.setuptools.package-data]
sushicore = ["py.typed"]
