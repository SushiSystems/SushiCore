# The base dependency fragment: the build infrastructure every SYCL module shares,
# whichever modules are checked out. A module's own dependencies do not live here;
# each module declares its own in `cli/sushistack.deps.toml`.
#
# A module CLI that sets `uses_base` reads this file before its own fragment when it
# runs `setup` or `doctor`, and `hub install` reads it before every module's. Either
# gathers the names for the active platform, checks what is present and installs only
# what is missing into the dependency root. No dependency name lives in installer code.
#
# Field reference:
#   description    Human-readable purpose, shown by `doctor`.
#   required       false => a missing one warns but does not stop the build.
#   gpu_only       true  => skipped when the GPU component is turned off.
#   linux_apt      apt package names; empty list = not needed on Linux.
#   windows_vcpkg  vcpkg port names; empty list = not needed on Windows.
#   check_cmd      Optional command; exit 0 means "already installed".
#   sha256         Optional table of platform to the SHA-256 of the file downloaded for
#                  this entry there: { windows = "<64 hex digits>", linux = "..." }.
#                  docs/reference/DEPENDENCY_FRAGMENT.md lists which entry pins which file.

[build_tools]
description   = "C++ compiler and core build tools (gcc, g++, make). Any GCC >= 9 suffices for the intel-llvm -fsycl host pass."
required      = true
linux_apt     = ["build-essential"]
windows_vcpkg = []

[cmake]
# Windows: installed via winget (Kitware.CMake) — cmake cannot
# bootstrap itself through vcpkg, and vcpkg itself requires cmake to run.
description   = "CMake build system. 3.20+ for intel-llvm / AdaptiveCpp; 3.25+ required for the oneAPI toolchain."
required      = true
linux_apt     = ["cmake"]
windows_vcpkg = []
check_cmd     = ["cmake", "--version"]

[ninja]
# Windows: installed via winget (Ninja-build.Ninja).
description   = "Ninja build generator (default generator on both platforms via config.toml)."
required      = true
linux_apt     = ["ninja-build"]
windows_vcpkg = []
check_cmd     = ["ninja", "--version"]

[gtest]
description   = "GoogleTest (unit / integration test framework). Shared: every module tests with it."
required      = true
linux_apt     = ["libgtest-dev"]
windows_vcpkg = ["gtest"]

[opencl]
description   = "OpenCL ICD loader + dev headers (exposes CPU as a SYCL device)"
required      = true
linux_apt     = ["ocl-icd-opencl-dev", "ocl-icd-libopencl1"]
windows_vcpkg = ["opencl"]
check_cmd     = ["pkg-config", "--exists", "OpenCL"]

[pkgconf]
description   = "pkg-config implementation (CMake uses it to locate hwloc and other libs)"
required      = true
linux_apt     = ["pkg-config"]
windows_vcpkg = ["pkgconf"]
check_cmd     = ["pkg-config", "--version"]

# Note: the SYCL toolchains (intel-llvm, AdaptiveCpp, oneAPI) and CUDA are NOT
# here — they are SushiRuntime's dependencies, declared in
# sushiruntime/cli/sushistack.deps.toml. This fragment has no SYCL or compute
# dependency of its own.
