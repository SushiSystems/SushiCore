# The base dependency fragment: the build infrastructure every SYCL module shares,
# whichever modules are checked out. A module's own dependencies do not live here;
# each module declares its own in `cli/sushistack.deps.toml`.
#
# A module CLI that sets `uses_base` reads this file before its own fragment when it
# runs `setup` or `doctor`, and `hub install` reads it before every module's. Either
# gathers the names for the active platform, checks what is present and installs only
# what is missing into the dependency root. No dependency name lives in installer code.
#
# Field reference:
#   description    Human-readable purpose, shown by `doctor`.
#   required       false => a missing one warns but does not stop the build.
#   gpu_only       true  => skipped when the GPU component is turned off.
#   linux_apt      apt package names; empty list = not needed on Linux.
#   windows_vcpkg  vcpkg port names; empty list = not needed on Windows.
#   check_cmd      Optional command; exit 0 means "already installed".
#   version        The release a download belongs to; with url and sha256 or none of them.
#   url            Table of platform to the exact address of the file downloaded there.
#   sha256         Optional table of platform to the SHA-256 of the file downloaded for
#                  this entry there: { windows = "<64 hex digits>", linux = "..." }.
#                  docs/reference/DEPENDENCY_FRAGMENT.md lists which entry pins which file.
#   ref            The tag or branch a clone's commit was resolved from, with `commit`.
#   commit         The full 40-hex commit a clone of the entry must end at. The installer checks
#                  that git's HEAD is this commit and stops when it is not; `ref` is a record
#                  of where the hash came from and is never fetched.
#   fingerprint    The full 40-hex fingerprint of a signing key. The installer installs the key
#                  only when the downloaded file holds a primary key with this fingerprint.

[build_tools]
description   = "C++ compiler and core build tools (gcc, g++, make). Any GCC >= 9 suffices for the intel-llvm -fsycl host pass."
required      = true
linux_apt     = ["build-essential"]
windows_vcpkg = []

[cmake]
# Windows: installed via winget (Kitware.CMake) — cmake cannot
# bootstrap itself through vcpkg, and vcpkg itself requires cmake to run.
description   = "CMake build system. 3.20+ for intel-llvm / AdaptiveCpp; 3.25+ required for the oneAPI toolchain."
required      = true
linux_apt     = ["cmake"]
windows_vcpkg = []
check_cmd     = ["cmake", "--version"]
# The portable zip direct-download installs when winget is absent. The digest is the line for
# this file in https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-SHA-256.txt.
version       = "v4.5.0"
url           = { windows = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-windows-x86_64.zip" }
sha256        = { windows = "301b1728317ccd84e984b02e366a8293735bc5ac618757d3d8f58b578f062411" }

[ninja]
# Windows: installed via winget (Ninja-build.Ninja).
description   = "Ninja build generator (default generator on both platforms via config.toml)."
required      = true
linux_apt     = ["ninja-build"]
windows_vcpkg = []
check_cmd     = ["ninja", "--version"]
# The zip direct-download installs when winget is absent. The digest is the sha256 GitHub's
# release API lists for the asset: ninja publishes no checksum file.
version       = "v1.13.2"
url           = { windows = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip" }
sha256        = { windows = "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65" }

[doxygen]
# The portable zip direct-download installs. The digest is the sha256 GitHub's release API
# lists for the asset: doxygen publishes no checksum file.
description   = "Doxygen, which builds the API reference."
required      = false
linux_apt     = []
windows_vcpkg = []
version       = "Release_1_18_0"
url           = { windows = "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.windows.x64.bin.zip" }
sha256        = { windows = "e84f54cfd49ef06b0b16536056dbec0c496323de28abcce53a4269463de35eaf" }

[intel-llvm]
# The nightly SYCL bundle the toolchain installer extracts. A module that builds SYCL declares
# the entry itself and the two merge; this one holds the pin. The digests are the sha256 GitHub's
# release API lists for each asset: intel/llvm publishes no checksum file.
description   = "intel/llvm nightly SYCL bundle (clang++ -fsycl)."
required      = false
gpu_only      = true
linux_apt     = []
windows_vcpkg = []
version       = "nightly-2026-11-17"
url           = { windows = "https://github.com/intel/llvm/releases/download/nightly-2026-11-17/sycl_windows.tar.gz", linux = "https://github.com/intel/llvm/releases/download/nightly-2026-11-17/sycl_linux.tar.gz" }
sha256        = { windows = "e4654153f8e0fce249b338dbd8ca1797d9c0dd613abceceab0a994318f4e8492", linux = "a6635eafa92ddbbcfad8685f987812418781e65915f5857b7463e4fccbf51342" }

[git]
# Windows: installed via winget (Git.Git), or by the installer direct-download runs when winget
# is absent. The digest is the line for this file in the release notes of
# https://github.com/git-for-windows/git/releases/tag/v2.56.1.windows.1.
description   = "Git, which fetches the pinned Sushi libraries."
required      = false
linux_apt     = []
windows_vcpkg = []
version       = "v2.56.1.windows.1"
url           = { windows = "https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/Git-2.56.1-64-bit.exe" }
sha256        = { windows = "c330c72e10b408cc39994bfefdb63542b0d93d21699325c3e0bd874af8a5a559" }

[gtest]
description   = "GoogleTest (unit / integration test framework). Shared: every module tests with it."
required      = true
linux_apt     = ["libgtest-dev"]
windows_vcpkg = ["gtest"]

[opencl]
description   = "OpenCL ICD loader + dev headers (exposes CPU as a SYCL device)"
required      = true
linux_apt     = ["ocl-icd-opencl-dev", "ocl-icd-libopencl1"]
windows_vcpkg = ["opencl"]
check_cmd     = ["pkg-config", "--exists", "OpenCL"]

[pkgconf]
description   = "pkg-config implementation (CMake uses it to locate hwloc and other libs)"
required      = true
linux_apt     = ["pkg-config"]
windows_vcpkg = ["pkgconf"]
check_cmd     = ["pkg-config", "--version"]

[vcpkg]
# The clone installs ports from; resolved with `git ls-remote https://github.com/microsoft/vcpkg.git master`.
description   = "vcpkg, the C++ port manager the Windows installer clones and bootstraps."
required      = false
linux_apt     = []
windows_vcpkg = []
ref           = "master"
commit        = "528cfa41f4b1578b16ac6b2f6d2e6f98e5308d2d"

[adaptivecpp]
# Resolved with `git ls-remote https://github.com/AdaptiveCpp/AdaptiveCpp.git refs/tags/v24.10.0`;
# the tag is a lightweight one, so the hash is the commit itself.
description   = "AdaptiveCpp source the toolchain installer builds."
required      = false
gpu_only      = true
linux_apt     = []
windows_vcpkg = []
ref           = "v24.10.0"
commit        = "7677cf6eefd8ab46d66168cd07ab042109448124"

[unified-runtime]
# The intel/llvm commit of the nightly the intel-llvm entry pins; the GPU adapters build from its
# unified-runtime folder. Resolved with `git ls-remote https://github.com/intel/llvm.git
# refs/tags/nightly-2026-11-17`. Renew it with the intel-llvm version and digests.
description   = "Unified Runtime sources the GPU adapter build checks out of intel/llvm."
required      = false
gpu_only      = true
linux_apt     = []
windows_vcpkg = []
ref           = "nightly-2026-11-17"
commit        = "c74ecddc2fd0542450e31e45bcc46cda98214058"

[oneapi-apt-key]
# The key that signs the Intel oneAPI apt repository, downloaded from
# https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB. The file holds five
# keys; this is the one that has not expired (valid until 2027-08), read from the file with
# `gpg --show-keys --with-colons`. Renew it when Intel publishes a new key.
description   = "Signing key of the Intel oneAPI apt repository."
required      = false
linux_apt     = []
windows_vcpkg = []
fingerprint   = "E9BF0AFC46D6E8B7DA5882F1BAC6F0C353D04109"

# Note: the SYCL toolchains (intel-llvm, AdaptiveCpp, oneAPI) and CUDA are
# SushiRuntime's dependencies, declared in sushiruntime/cli/sushistack.deps.toml.
# This fragment holds only the pin of the intel-llvm download.
